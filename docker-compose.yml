services:
  php:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shanbora_php
    volumes:
      - ./:/var/www/shanbora:cached
      - composer_cache:/root/.composer
    environment:
      - DATABASE_URL=mysql://shanbora:shanbora@shared_mariadb:3306/shanbora?serverVersion=mariadb-11.4.9
    networks:
      - symfony
      - db_shared

  nginx:
    image: nginx:alpine
    container_name: shanbora_nginx
    volumes:
      - ./public:/var/www/shanbora/public:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - symfony
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shanbora.rule=Host(`shanbora.local`)"
      - "traefik.http.routers.shanbora.entrypoints=websecure"
      - "traefik.http.routers.shanbora.tls=true"
      - "traefik.http.services.shanbora.loadbalancer.server.port=80"

  node:
    image: node:24.19.0-alpine
    container_name: shanbora_node
    working_dir: /var/www/shanbora
    volumes:
      - ./:/var/www/shanbora:cached
      - node_modules:/var/www/shanbora/node_modules
    command: sh -c "yarn install && chown -R ${UID:-1000}:${GID:-1000} /var/www/shanbora/node_modules && yarn watch"
    networks:
      - symfony

networks:
  symfony:
    driver: bridge
  db_shared:
    external: true
  proxy:
    external: true

volumes:
  composer_cache:
    external: true
    name: composer_cache_shared
  node_modules:
